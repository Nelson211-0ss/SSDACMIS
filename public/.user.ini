; Applies when PHP runs as php-fpm/CGI (nginx, or Apache+php-fpm) — .htaccess
; php_value directives below have no effect under those SAPIs, so the limits
; are repeated here. Stock distro php.ini (e.g. Ubuntu's default 2M/8M) is
; otherwise too small for real phone-camera passport photos and logo uploads.
upload_max_filesize = 12M
post_max_size = 15M
max_execution_time = 60
